services:
  db:
    image: mariadb:11.8
    container_name: smh-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
      MARIADB_DATABASE: ${DB_NAME:-ghg_emissions_calculator_db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - smh_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  smh_mariadb_data:
    name: smh_mariadb_data
