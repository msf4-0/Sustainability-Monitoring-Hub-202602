[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true

[logger]
level = "info"

[client]
showErrorDetails = true
toolbarMode = "viewer"


[theme]
base = "dark"
primaryColor = "#22c55e"               # Emerald-400
backgroundColor = "#0f172a"            # Slate-950
secondaryBackgroundColor = "#111827"   # Slate-900
textColor = "#e2e8f0"                  # Gray-200
font = "sans serif"